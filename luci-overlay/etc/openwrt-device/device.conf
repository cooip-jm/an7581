# AN7581 Device Configuration
# Nokia XG-040G-MD, Airoha EN7581 SoC

MODEL="AN7581"
VENDOR="Nokia"
PRODUCT="XG-040G-MD"
SOC="EN7581"
SOC_VENDOR="Airoha"
KERNEL_VERSION="5.4.55"
ARCH="aarch64"

# PON
PON_TYPE="XGPON"
PON_DEV="/dev/pon"
PON_PROC="/proc/tc3162"

# Vendor binaries (probe confirmed: all in /sbin)
VENDOR_BIN="/sbin"
VENDOR_LIB="/lib:/usr/lib:/lib64"
PONMGR="/sbin/ponmgr"
OMCIMGR="/sbin/omciMgr"
RITOOL="/sbin/ritool"
HCFTOOL="hcfgtool"

# Hardware (verified from boot log)
LAN_PORTS=4        # 3x GE + 1x 2.5G
WIFI_RADIOS=0      # 无 WiFi — "No WiFi chip on board"
VOICE_PORTS=0      # 无 POTS — "POTS number is 0"
SFP_SLOT=1         # EN7572 BOSA

# Flash
FLASH_TYPE="NAND"
TOTAL_FLASH="256MiB"
ROOTFS_SIZE="~27MB"
DATA_SIZE="~128MB"
CONFIGS_SIZE="~10MB"

# LED
LED_PON="pon"
LED_WAN="wan"
LED_LAN="lan"
