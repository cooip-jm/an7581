name: Build AN7581 OpenWrt Rootfs

on:
  workflow_dispatch:
  push:
    branches: [40md]
    paths:
      - 'luci-overlay/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build rootfs with PON overlay
        run: |
          set -e

          # ── Download base OpenWrt rootfs ────────────────
          echo "Downloading OpenWrt 25.12.5 armsr rootfs..."
          wget -q "https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-25.12.5-armsr-armv8-rootfs.tar.gz" \
               -O /tmp/openwrt-base.tar.gz || \
          wget -q "https://github.com/sbwml/builder/releases/download/v25.12.5-minimal/openwrt-25.12.5-armsr-armv8-generic-targz-rootfs.tar.gz" \
               -O /tmp/openwrt-base.tar.gz

          echo "Base rootfs: $(ls -lh /tmp/openwrt-base.tar.gz | awk '{print $5}')"

          # ── Extract base rootfs ─────────────────────────
          mkdir -p output/rootfs
          tar xzf /tmp/openwrt-base.tar.gz -C output/rootfs/
          echo "Base rootfs extracted: $(du -sh output/rootfs/ | awk '{print $1}')"

          # ── Apply PON overlay ───────────────────────────
          echo "Applying PON overlay..."
          cp -a luci-overlay/* output/rootfs/

          # ── Package rootfs tarball ───────────────────────
          cd output
          tar czf rootfs.tar.gz -C rootfs .
          echo "rootfs.tar.gz: $(ls -lh rootfs.tar.gz | awk '{print $5}')"

          # ── Also package overlay separately ─────────────
          tar czf luci-overlay.tar.gz -C ../luci-overlay .

          # ── Collect artifacts ────────────────────────────
          mkdir -p release
          cp rootfs.tar.gz release/
          cp luci-overlay.tar.gz release/
          cp ../output/install_overlay.sh release/ 2>/dev/null || true

          echo "=== Release artifacts ==="
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: an7581-rootfs
          path: output/release/
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "AN7581 Build #${{ github.run_number }}"
          body: |
            ## Nokia XG-040G-MD (AN7581) OpenWrt Rootfs with PON Management

            ### Files
            - `rootfs.tar.gz` — Complete OpenWrt rootfs with LuCI + PON overlay (for LXC testing)
            - `luci-overlay.tar.gz` — PON overlay only (for vendor rootfs)

            ### LXC Testing
            ```bash
            # On ARM64 device with LXC
            lxc-create -t download -n an7581 -- -d openwrt -r 25.12.5 -a arm64
            # Or manually:
            tar xzf rootfs.tar.gz -C /var/lib/lxc/an7581/rootfs
            ```

            ### Device Installation (vendor rootfs)
            ```bash
            tar xzf luci-overlay.tar.gz -C /
            /etc/init.d/vendor_web start
            ```
          files: output/release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
